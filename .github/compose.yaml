services:
  arelx:
    # CI injects the specific image SHA/Tag here
    image: arelx-matrix:latest
    container_name: arelx-ci
    hostname: arelx-ci
    volumes:
      - ..:/app
    working_dir: /app
    # Keep container running so we can 'exec' into it
    command: tail -f /dev/null
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mssql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
      MSSQL_HOST: mssql
      MISE_TRUSTED_CONFIG_PATHS: /app

  mysql:
    image: mysql:8.0
    container_name: arelx-mysql
    environment:
      MYSQL_DATABASE: arelx_test
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: arelx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: arelx_test
    command: >
      bash -c "
      locale-gen fr_FR.utf8 && update-locale &&
      localedef -i fr_FR -c -f UTF-8 -A /usr/share/locale/locale.alias fr_FR.UTF-8 &&
      docker-entrypoint.sh postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: arelx-mssql
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Password12!
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 5s
      retries: 5
      start_period: 10s
      timeout: 5s
