name: Container Image Build

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      watch_files:
        required: true
        type: string
    outputs:
      docker_image:
        description: "The resulting Docker image tag"
        value: ${{ jobs.build.outputs.docker_image }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      docker_image: ${{ steps.determine_tag.outputs.docker_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: ${{ inputs.watch_files }}

      - name: Set up Docker Buildx
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha

      - name: Build and push Docker image
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ inputs.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ inputs.image_name }}:buildcache,mode=max

      - name: Determine downstream image tag
        id: determine_tag
        run: |
          # If we built a new image (changed files or dispatch)
          if [ "${{ steps.changed-files.outputs.any_changed }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "docker_image=${{ env.REGISTRY }}/${{ inputs.image_name }}:pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            else
              echo "docker_image=${{ env.REGISTRY }}/${{ inputs.image_name }}:latest" >> $GITHUB_OUTPUT
            fi
          else
            echo "No changes detected. Fallback to latest."
            echo "docker_image=${{ env.REGISTRY }}/${{ inputs.image_name }}:latest" >> $GITHUB_OUTPUT
          fi
