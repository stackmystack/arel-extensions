name: Build and Test

# Ruby + Rails Compatibility Matrix from here:
# https://www.fastruby.io/blog/ruby/rails/versions/compatibility-table.html
#
# Images are fixed to ubuntu 22.04 because jruby-9.2 is unavailable in
# ubuntu-24.04 (ubuntu-latest when I tested). Also, for rails < 6, sqlite3
# will not build because libsqlite3-dev is missing.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve_image:
    name: Resolve CI image
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute image tag and verify it exists
        id: resolve
        run: |
          hash=$(sha256sum .github/images/Dockerfile | cut -d' ' -f1)
          tag="ghcr.io/${{ github.repository_owner }}/arel-ci:${hash}"
          echo "Resolved tag: ${tag}"
          if ! docker manifest inspect "${tag}" > /dev/null 2>&1; then
            echo "CI image ${tag} was not found on ghcr.io."
            echo "This usually means .github/images/Dockerfile changed and hasn't been built on master yet."
            echo "Push the change to master (or run the 'Build CI image' workflow manually) first, then re-run this workflow."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  job_test_to_sql:
    name: test to_sql
    needs: resolve_image
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.resolve_image.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        versions:
          [
            { ruby: "3.4", rails: 8_1, arelx: 2 },
            { ruby: "3.4", rails: 8, arelx: 2 },
            { ruby: "3.4", rails: 7_2, arelx: 2 },
            { ruby: "3.4", rails: 7_1, arelx: 2 },
            { ruby: "3.4", rails: 7, arelx: 2 },
            { ruby: "3.4", rails: 6_1, arelx: 2 },
            { ruby: "3.3", rails: 8_1, arelx: 2 },
            { ruby: "3.3", rails: 8, arelx: 2 },
            { ruby: "3.3", rails: 7_2, arelx: 2 },
            { ruby: "3.3", rails: 7_1, arelx: 2 },
            { ruby: "3.3", rails: 7, arelx: 2 },
            { ruby: "3.3", rails: 6_1, arelx: 2 },
            { ruby: "3.2", rails: 8_1, arelx: 2 },
            { ruby: "3.2", rails: 8, arelx: 2 },
            { ruby: "3.2", rails: 7_2, arelx: 2 },
            { ruby: "3.2", rails: 7_1, arelx: 2 },
            { ruby: "3.2", rails: 7, arelx: 2 },
            { ruby: "3.2", rails: 6, arelx: 2 },
            { ruby: "3.2", rails: 6_1, arelx: 2 },
            { ruby: "3.1", rails: 7_2, arelx: 2 },
            { ruby: "3.1", rails: 7_1, arelx: 2 },
            { ruby: "3.1", rails: 7, arelx: 2 },
            { ruby: "3.1", rails: 6_1, arelx: 2 },
            { ruby: "3.1", rails: 6, arelx: 2 },
            { ruby: "3.0", rails: 7_1, arelx: 2 },
            { ruby: "3.0", rails: 7, arelx: 2 },
            { ruby: "3.0", rails: 6_1, arelx: 2 },
            { ruby: "2.7", rails: 7_1, arelx: 2 },
            { ruby: "2.7", rails: 7, arelx: 2 },
            { ruby: "2.7", rails: 6_1, arelx: 2 },
            { ruby: "2.7", rails: 6, arelx: 2 },
            { ruby: "2.7", rails: 5_2, arelx: 1 },
            { ruby: jruby-9.2, rails: 6_1, arelx: 2 },
            { ruby: jruby-9.2, rails: 6, arelx: 2 },
            { ruby: jruby-9.2, rails: 5_2, arelx: 1 },
            { ruby: jruby-9.3, rails: 6_1, arelx: 2 },
            { ruby: jruby-9.3, rails: 6, arelx: 2 },
            { ruby: jruby-9.3, rails: 5_2, arelx: 1 },
          ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Gemfile
        run: |
          cp ./gemspecs/arel_extensions-v${{ matrix.versions.arelx }}.gemspec ./arel_extensions.gemspec
          cp ./version_v${{ matrix.versions.arelx }}.rb lib/arel_extensions/version.rb
          cp ./gemfiles/rails${{ matrix.versions.rails }}.gemfile ./Gemfile
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.versions.ruby }}
          bundler-cache: true
      - name: bundle install
        run: bundle install --retry 3
      - name: Capture bundler diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/bundle-diagnostics
          cp Gemfile /tmp/bundle-diagnostics/ || true
          cp Gemfile.lock /tmp/bundle-diagnostics/ || true
          bundle env > /tmp/bundle-diagnostics/bundle-env.txt 2>&1 || true
          gem list > /tmp/bundle-diagnostics/gem-list.txt 2>&1 || true
      - name: Upload bundler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-debug-to_sql-${{ matrix.versions.ruby }}-${{ matrix.versions.rails }}-${{ matrix.versions.arelx }}
          path: /tmp/bundle-diagnostics
          retention-days: 5
      - name: Run test to_sql
        run: bundle exec rake test:to_sql

  job_test_sqlite:
    name: test sqlite
    needs: resolve_image
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.resolve_image.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        versions:
          [
            { ruby: "3.4", rails: 8_1, arelx: 2 },
            { ruby: "3.4", rails: 8, arelx: 2 },
            { ruby: "3.4", rails: 7_2, arelx: 2 },
            { ruby: "3.4", rails: 7_1, arelx: 2 },
            { ruby: "3.4", rails: 7, arelx: 2 },
            { ruby: "3.4", rails: 6_1, arelx: 2 },
            { ruby: "3.3", rails: 8_1, arelx: 2 },
            { ruby: "3.3", rails: 8, arelx: 2 },
            { ruby: "3.3", rails: 7_2, arelx: 2 },
            { ruby: "3.3", rails: 7_1, arelx: 2 },
            { ruby: "3.3", rails: 7, arelx: 2 },
            { ruby: "3.3", rails: 6_1, arelx: 2 },
            { ruby: "3.2", rails: 8_1, arelx: 2 },
            { ruby: "3.2", rails: 8, arelx: 2 },
            { ruby: "3.2", rails: 7_2, arelx: 2 },
            { ruby: "3.2", rails: 7_1, arelx: 2 },
            { ruby: "3.2", rails: 7, arelx: 2 },
            { ruby: "3.2", rails: 6_1, arelx: 2 },
            { ruby: "3.2", rails: 6, arelx: 2 },
            { ruby: "3.1", rails: 7_2, arelx: 2 },
            { ruby: "3.1", rails: 7_1, arelx: 2 },
            { ruby: "3.1", rails: 7, arelx: 2 },
            { ruby: "3.1", rails: 6, arelx: 2 },
            { ruby: "3.1", rails: 6_1, arelx: 2 },
            { ruby: "3.0", rails: 7_1, arelx: 2 },
            { ruby: "3.0", rails: 7, arelx: 2 },
            { ruby: "3.0", rails: 6_1, arelx: 2 },
            { ruby: "2.7", rails: 7_1, arelx: 2 },
            { ruby: "2.7", rails: 7, arelx: 2 },
            { ruby: "2.7", rails: 6_1, arelx: 2 },
            { ruby: "2.7", rails: 6, arelx: 2 },
            { ruby: "2.7", rails: 5_2, arelx: 1 },
            { ruby: jruby-9.2, rails: 6_1, arelx: 2 },
            { ruby: jruby-9.2, rails: 6, arelx: 2 },
            { ruby: jruby-9.2, rails: 5_2, arelx: 1 },
            { ruby: jruby-9.3, rails: 6_1, arelx: 2 },
            { ruby: jruby-9.3, rails: 6, arelx: 2 },
            { ruby: jruby-9.3, rails: 5_2, arelx: 1 },
          ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Gemfile
        run: |
          cp ./gemspecs/arel_extensions-v${{ matrix.versions.arelx }}.gemspec ./arel_extensions.gemspec
          cp ./version_v${{ matrix.versions.arelx }}.rb lib/arel_extensions/version.rb
          cp ./gemfiles/rails${{ matrix.versions.rails }}.gemfile ./Gemfile
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.versions.ruby }}
          bundler-cache: true
      - name: bundle install
        run: bundle install --retry 3
      - name: Capture bundler diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/bundle-diagnostics
          cp Gemfile /tmp/bundle-diagnostics/ || true
          cp Gemfile.lock /tmp/bundle-diagnostics/ || true
          bundle env > /tmp/bundle-diagnostics/bundle-env.txt 2>&1 || true
          gem list > /tmp/bundle-diagnostics/gem-list.txt 2>&1 || true
      - name: Upload bundler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-debug-sqlite-${{ matrix.versions.ruby }}-${{ matrix.versions.rails }}-${{ matrix.versions.arelx }}
          path: /tmp/bundle-diagnostics
          retention-days: 5
      - name: Run test sqlite
        run: bundle exec rake test:sqlite

  job_test_postgres:
    name: test postgres
    needs: resolve_image
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.resolve_image.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        versions: [
            { ruby: "3.4", rails: 8_1, arelx: 2 },
            { ruby: "3.4", rails: 8, arelx: 2 },
            { ruby: "3.4", rails: 7_2, arelx: 2 },
            { ruby: "3.4", rails: 7_1, arelx: 2 },
            { ruby: "3.4", rails: 7, arelx: 2 },
            { ruby: "3.4", rails: 6_1, arelx: 2 },
            { ruby: "3.3", rails: 8_1, arelx: 2 },
            { ruby: "3.3", rails: 8, arelx: 2 },
            { ruby: "3.3", rails: 7_2, arelx: 2 },
            { ruby: "3.3", rails: 7_1, arelx: 2 },
            { ruby: "3.3", rails: 7, arelx: 2 },
            { ruby: "3.3", rails: 6_1, arelx: 2 },
            { ruby: "3.2", rails: 8_1, arelx: 2 },
            { ruby: "3.2", rails: 8, arelx: 2 },
            { ruby: "3.2", rails: 7_2, arelx: 2 },
            { ruby: "3.2", rails: 7_1, arelx: 2 },
            { ruby: "3.2", rails: 7, arelx: 2 },
            { ruby: "3.2", rails: 6_1, arelx: 2 },
            # { ruby: "3.2", rails: 6, arelx: 2 }, # cannot test > undefined symbol: rb_tainted_str_new2
            { ruby: "3.1", rails: 7_2, arelx: 2 },
            { ruby: "3.1", rails: 7_1, arelx: 2 },
            { ruby: "3.1", rails: 7, arelx: 2 },
            { ruby: "3.1", rails: 6_1, arelx: 2 },
            { ruby: "3.1", rails: 6, arelx: 2 },
            { ruby: "3.0", rails: 7_1, arelx: 2 },
            { ruby: "3.0", rails: 7, arelx: 2 },
            { ruby: "3.0", rails: 6_1, arelx: 2 },
            { ruby: "2.7", rails: 7_1, arelx: 2 },
            { ruby: "2.7", rails: 7, arelx: 2 },
            { ruby: "2.7", rails: 6_1, arelx: 2 },
            { ruby: "2.7", rails: 6, arelx: 2 },
            { ruby: "2.7", rails: 5_2, arelx: 1 },
            { ruby: jruby-9.2, rails: 6_1, arelx: 2 },
            { ruby: jruby-9.2, rails: 6, arelx: 2 },
            { ruby: jruby-9.2, rails: 5_2, arelx: 1 },
            { ruby: jruby-9.3, rails: 6_1, arelx: 2 },
            { ruby: jruby-9.3, rails: 6, arelx: 2 },
            { ruby: jruby-9.3, rails: 5_2, arelx: 1 },
          ]
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres
        # Postgres itself, its user, and the arelx_test database are all
        # already baked into the CI image.
        run: |
          service postgresql start
          until pg_isready -U postgres > /dev/null 2>&1; do sleep 1; done
      - name: Setup Gemfile
        run: |
          cp ./gemspecs/arel_extensions-v${{ matrix.versions.arelx }}.gemspec ./arel_extensions.gemspec
          cp ./version_v${{ matrix.versions.arelx }}.rb lib/arel_extensions/version.rb
          cp ./gemfiles/rails${{ matrix.versions.rails }}.gemfile ./Gemfile
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.versions.ruby }}
          bundler-cache: true
      - name: bundle install
        run: bundle install --retry 3
      - name: Capture bundler diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/bundle-diagnostics
          cp Gemfile /tmp/bundle-diagnostics/ || true
          cp Gemfile.lock /tmp/bundle-diagnostics/ || true
          bundle env > /tmp/bundle-diagnostics/bundle-env.txt 2>&1 || true
          gem list > /tmp/bundle-diagnostics/gem-list.txt 2>&1 || true
      - name: Upload bundler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-debug-postgres-${{ matrix.versions.ruby }}-${{ matrix.versions.rails }}-${{ matrix.versions.arelx }}
          path: /tmp/bundle-diagnostics
          retention-days: 5
      - name: Run test Postgres
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: bundle exec rake test:postgresql

  job_test_mysql:
    name: test mysql
    needs: resolve_image
    runs-on: ubuntu-22.04
    container:
      image: ${{ needs.resolve_image.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        versions: [
            { ruby: "3.4", rails: 8_1, arelx: 2 },
            { ruby: "3.4", rails: 8, arelx: 2 },
            { ruby: "3.4", rails: 7_2, arelx: 2 },
            { ruby: "3.4", rails: 7_1, arelx: 2 },
            { ruby: "3.4", rails: 7, arelx: 2 },
            { ruby: "3.4", rails: 6_1, arelx: 2 },
            { ruby: "3.3", rails: 8_1, arelx: 2 },
            { ruby: "3.3", rails: 8, arelx: 2 },
            { ruby: "3.3", rails: 7_2, arelx: 2 },
            { ruby: "3.3", rails: 7_1, arelx: 2 },
            { ruby: "3.3", rails: 7, arelx: 2 },
            { ruby: "3.3", rails: 6_1, arelx: 2 },
            { ruby: "3.2", rails: 8_1, arelx: 2 },
            { ruby: "3.2", rails: 8, arelx: 2 },
            { ruby: "3.2", rails: 7_2, arelx: 2 },
            { ruby: "3.2", rails: 7_1, arelx: 2 },
            { ruby: "3.2", rails: 7, arelx: 2 },
            { ruby: "3.2", rails: 6_1, arelx: 2 },
            # { ruby: "3.2", rails: 6, arelx: 2 }, # cannot test > undefined symbol: rb_tainted_str_new2
            { ruby: "3.1", rails: 7_2, arelx: 2 },
            { ruby: "3.1", rails: 7_1, arelx: 2 },
            { ruby: "3.1", rails: 7, arelx: 2 },
            { ruby: "3.1", rails: 6_1, arelx: 2 },
            { ruby: "3.1", rails: 6, arelx: 2 },
            { ruby: "3.0", rails: 7_1, arelx: 2 },
            { ruby: "3.0", rails: 7, arelx: 2 },
            { ruby: "3.0", rails: 6_1, arelx: 2 },
            { ruby: "2.7", rails: 7_1, arelx: 2 },
            { ruby: "2.7", rails: 7, arelx: 2 },
            { ruby: "2.7", rails: 6_1, arelx: 2 },
            { ruby: "2.7", rails: 6, arelx: 2 },
            { ruby: "2.7", rails: 5_2, arelx: 1 },
            { ruby: jruby-9.2, rails: 6_1, arelx: 2 },
            { ruby: jruby-9.2, rails: 6, arelx: 2 },
            { ruby: jruby-9.2, rails: 5_2, arelx: 1 },
            { ruby: jruby-9.3, rails: 6_1, arelx: 2 },
            { ruby: jruby-9.3, rails: 6, arelx: 2 },
            { ruby: jruby-9.3, rails: 5_2, arelx: 1 },
          ]
    steps:
      - uses: actions/checkout@v7
      - name: Start MySQL
        # MySQL itself, the utf8mb4 defaults, and the arelx_test database are
        # all already baked into the CI image (see
        # .github/images/Dockerfile); all that's left at job time is
        # starting the service.
        run: |
          service mysql start
          until mysqladmin ping --silent > /dev/null 2>&1; do sleep 1; done
      - name: Setup Gemfile
        run: |
          cp ./gemspecs/arel_extensions-v${{ matrix.versions.arelx }}.gemspec ./arel_extensions.gemspec
          cp ./version_v${{ matrix.versions.arelx }}.rb lib/arel_extensions/version.rb
          cp ./gemfiles/rails${{ matrix.versions.rails }}.gemfile ./Gemfile
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.versions.ruby }}
          bundler-cache: true
      - name: bundle install
        run: bundle install --retry 3
      - name: Capture bundler diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/bundle-diagnostics
          cp Gemfile /tmp/bundle-diagnostics/ || true
          cp Gemfile.lock /tmp/bundle-diagnostics/ || true
          bundle env > /tmp/bundle-diagnostics/bundle-env.txt 2>&1 || true
          gem list > /tmp/bundle-diagnostics/gem-list.txt 2>&1 || true
      - name: Upload bundler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-debug-mysql-${{ matrix.versions.ruby }}-${{ matrix.versions.rails }}-${{ matrix.versions.arelx }}
          path: /tmp/bundle-diagnostics
          retention-days: 5
      - name: Run test MySql
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: arelx_test
          DB_USERNAME: root
        run: bundle exec rake test:mysql

  job_test_mssql:
    name: test mssql on linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        versions: [
            { ruby: "3.4", rails: 8_1, arelx: 2 },
            { ruby: "3.4", rails: 8, arelx: 2 },
            { ruby: "3.4", rails: 7_2, arelx: 2 },
            { ruby: "3.4", rails: 7_1, arelx: 2 },
            { ruby: "3.4", rails: 7, arelx: 2 },
            { ruby: "3.4", rails: 6_1, arelx: 2 },
            { ruby: "3.3", rails: 8_1, arelx: 2 },
            { ruby: "3.3", rails: 8, arelx: 2 },
            { ruby: "3.3", rails: 7_2, arelx: 2 },
            { ruby: "3.3", rails: 7_1, arelx: 2 },
            { ruby: "3.3", rails: 7, arelx: 2 },
            { ruby: "3.3", rails: 6_1, arelx: 2 },
            { ruby: "3.3", rails: 6, arelx: 2 },
            { ruby: "3.2", rails: 8_1, arelx: 2 },
            { ruby: "3.2", rails: 8, arelx: 2 },
            { ruby: "3.2", rails: 7_1, arelx: 2 },
            { ruby: "3.2", rails: 7, arelx: 2 },
            { ruby: "3.2", rails: 6_1, arelx: 2 },
            { ruby: "3.2", rails: 6, arelx: 2 },
            { ruby: "3.1", rails: 7_1, arelx: 2 },
            { ruby: "3.1", rails: 7, arelx: 2 },
            { ruby: "3.1", rails: 6_1, arelx: 2 },
            { ruby: "3.1", rails: 6, arelx: 2 },
            { ruby: "3.0", rails: 7, arelx: 2 },
            { ruby: "3.0", rails: 6_1, arelx: 2 },
            { ruby: "3.0", rails: 6, arelx: 2 },
            { ruby: "2.7", rails: 6_1, arelx: 2 },
            { ruby: "2.7", rails: 6, arelx: 2 },
            { ruby: "2.7", rails: 5_2, arelx: 1 },
            # {ruby: jruby-9.2,   rails: 6_1, arelx: 2},
            # {ruby: jruby-9.2,   rails: 6,   arelx: 2},
            { ruby: jruby-9.2, rails: 5_2, arelx: 1 },
            # See comments on 9.4 to understand why these are disabled for now.
            # {ruby: jruby-9.3,   rails: 6_1, arelx: 2},
            # {ruby: jruby-9.3,   rails: 6,   arelx: 2},
            # {ruby: jruby-9.3,   rails: 5_2, arelx: 1},
            { ruby: jruby-9.4.10, rails: 7_1, arelx: 2 }, # The reason we pin to the patch level is https://github.com/ruby/psych/issues/700
            { ruby: jruby-9.4.10, rails: 7, arelx: 2 },
            #
            # 6 and 6.1 don't work because of a bug in the alt adapter
            # https://github.com/JesseChavez/activerecord-jdbc-adapter/issues/16
            # {ruby: jruby-9.4,   rails: 6_1, arelx: 2},
            # {ruby: jruby-9.4,   rails: 6,   arelx: 2},
            #
            # < 5.2 don't work because of a deeper issue.
            # {ruby: jruby-9.4,   rails: 5_2, arelx: 1},
          ]
        mssql: [2017, 2019]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Gemfile
        run: |
          cp ./gemspecs/arel_extensions-v${{ matrix.versions.arelx }}.gemspec ./arel_extensions.gemspec
          cp ./version_v${{ matrix.versions.arelx }}.rb lib/arel_extensions/version.rb
          cp ./gemfiles/rails${{ matrix.versions.rails }}.gemfile ./Gemfile
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.versions.ruby }}
          bundler-cache: true
      - name: Install FreeTDS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y freetds-dev
      - name: Install MSSQL ${{ matrix.mssql }}
        uses: potatoqualitee/mssqlsuite@v1.5.1
        with:
          version: ${{ matrix.mssql }}
          install: sqlengine, sqlclient, sqlpackage, localdb
          sa-password: Password12!
      - name: bundle install
        run: bundle install --retry 3
      - name: Capture bundler diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/bundle-diagnostics
          cp Gemfile /tmp/bundle-diagnostics/ || true
          cp Gemfile.lock /tmp/bundle-diagnostics/ || true
          bundle env > /tmp/bundle-diagnostics/bundle-env.txt 2>&1 || true
          gem list > /tmp/bundle-diagnostics/gem-list.txt 2>&1 || true
      - name: Upload bundler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-debug-mssql-${{ matrix.versions.ruby }}-${{ matrix.versions.rails }}-${{ matrix.versions.arelx }}-${{ matrix.mssql }}
          path: /tmp/bundle-diagnostics
          retention-days: 5
      - name: Run test mssql [mri]
        if: ${{ !contains(matrix.versions.ruby, 'jruby') }}
        run: bundle exec rake test:mssql
      - name: Run test mssql [jruby]
        if: ${{ contains(matrix.versions.ruby, 'jruby') }}
        run: |
          curl -LO https://github.com/microsoft/mssql-jdbc/releases/download/v8.4.1/mssql-jdbc-8.4.1.jre11.jar
          CLASSPATH=".:mssql-jdbc-8.4.1.jre11.jar" bundle exec rake test:mssql
