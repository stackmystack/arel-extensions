name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/arel-extensions

jobs:
  build_image:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      docker_image: ${{ steps.determine_tag.outputs.docker_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            dev/arelx.dockerfile
            mise.toml

      - name: Set up Docker Buildx
        # Run if files changed OR if manually triggered
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha

      - name: Build and push Docker image
        if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dev/arelx.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # FIX: Output json so we can parse specific tags if needed,
          # though we handle tag logic in the next step manually for clarity.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # FIX: Consolidated logic to determine exactly which tag the Test job should use.
      # This handles the "Unchanged = latest" vs "Changed = pr-number/sha" logic centrally.
      - name: Determine downstream image tag
        id: determine_tag
        run: |
          if [ "${{ steps.changed-files.outputs.any_changed }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "docker_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            else
              echo "docker_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
            fi
          else
            echo "No changes detected. Fallback to latest."
            echo "docker_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: build_image
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Prepare Image
        run: |
          # Pull the exact artifact from previous job
          docker pull ${{ needs.build_image.outputs.docker_image }}
          docker tag ${{ needs.build_image.outputs.docker_image }} arelx-matrix:latest

      - name: Start Environment
        run: |
          # --wait pauses script until healthchecks pass.
          docker compose -f dev/compose.base.yaml -f .github/compose.yaml up -d --wait

      - name: Run Tests
        run: |
          docker compose -f dev/compose.base.yaml -f .github/compose.yaml exec -T arelx \
            /app/bin/test

  cleanup:
    name: Clean up PR image
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR image
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'arel-extensions'
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'false'
          ignore-versions: 'latest'
          version-names: pr-${{ github.event.number }}
