name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build_arelx:
    name: "Arelx Container Image"
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ${{ github.repository }}/arel-extensions
      dockerfile: dev/arelx.dockerfile
      watch_files: |
        dev/arelx.dockerfile
        mise.toml

  build_gemstash:
    name: "Gemstash Container Image"
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ${{ github.repository }}/arelx-gemstash
      dockerfile: dev/gemstash.dockerfile
      watch_files: |
        dev/gemstash.dockerfile

  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [build_arelx, build_gemstash]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rails < 6
            command: bin/test rails:5.2 && bin/test rails:6 # 14 + 28 = 42
          - name: Rails 6.1
            command: bin/test rails:6.1 # 38
          - name: Rails 7 on Ruby 3.2+
            command: bin/test rails:7 ruby:3.2:3.4 # 15
          - name: Rails 7 on Ruby 2.7 -> 3.1 & JRuby
            command: bin/test rails:7 'ruby:3.2:3.4' # 20
          - name: Rails 7.1 on Ruby 3.2+
            command: bin/test rails:7.1 ruby:3.2:3.4 # 15
          - name: Rails 7.1 on Ruby 2.7 -> 3.1 & JRuby
            command: bin/test rails:7.1 'ruby:!3.2:3.4' # 20
          - name: Rails 7.2
            command: bin/test rails:7.2 # 20
          - name: Rails 8+
            command: bin/test rails:8 && bin/test rails:8.1 # 15 + 15 = 30
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Prepare Images
        run: |
          # Pull arelx image from reusable output
          docker pull ${{ needs.build_arelx.outputs.docker_image }}
          docker tag ${{ needs.build_arelx.outputs.docker_image }} arelx-matrix:latest

          # Pull gemstash image from reusable output
          docker pull ${{ needs.build_gemstash.outputs.docker_image }}
          docker tag ${{ needs.build_gemstash.outputs.docker_image }} arelx-gemstash:latest

      - name: Start Environment
        run: |
          # --wait pauses script until healthchecks pass.
          docker compose -f dev/compose.base.yaml -f .github/compose.yaml up -d --wait

      - name: Run Tests
        run: |
          ${{ matrix.command }}

  cleanup:
    name: Clean up PR images
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR image (arel-extensions)
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'arel-extensions'
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'false'
          ignore-versions: 'latest'
          version-names: pr-${{ github.event.number }}

      - name: Delete PR image (arelx-gemstash)
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'arelx-gemstash'
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'false'
          ignore-versions: 'latest'
          version-names: pr-${{ github.event.number }}
