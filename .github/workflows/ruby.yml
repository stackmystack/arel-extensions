name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build_arelx:
    name: "Arelx Container Image"
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ${{ github.repository }}/arel-extensions
      dockerfile: dev/arelx.dockerfile
      watch_files: |
        dev/arelx.dockerfile
        mise.toml

  build_gemstash:
    name: "Gemstash Container Image"
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image_name: ${{ github.repository }}/arelx-gemstash
      dockerfile: dev/gemstash.dockerfile
      watch_files: |
        dev/gemstash.dockerfile

  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [build_arelx, build_gemstash]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JRuby
            command: "bin/test jruby:: 'test:!sqlite' 'test:!to_sql'"
          - name: MRI Ruby (2.7 -> 3.1)
            command: "bin/test ruby:2.7:3.1 'test:!sqlite' 'test:!to_sql'"
          - name: MRI Ruby (3.2 -> 3.4)
            command: "bin/test ruby:3.2:3.4 'test:!sqlite' 'test:!to_sql'"
          - name: SQLite & To-SQL
            command: "bin/test test:sqlite && bin/test test:to_sql"
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Prepare Images
        run: |
          # Pull arelx image from reusable output
          docker pull ${{ needs.build_arelx.outputs.docker_image }}
          docker tag ${{ needs.build_arelx.outputs.docker_image }} arelx-matrix:latest

          # Pull gemstash image from reusable output
          docker pull ${{ needs.build_gemstash.outputs.docker_image }}
          docker tag ${{ needs.build_gemstash.outputs.docker_image }} arelx-gemstash:latest

      - name: Start Environment
        run: |
          # --wait pauses script until healthchecks pass.
          docker compose -f dev/compose.base.yaml -f .github/compose.yaml up -d --wait

      - name: Run Tests
        run: |
          ${{ matrix.command }}

  cleanup:
    name: Clean up PR images
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR image (arel-extensions)
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'arel-extensions'
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'false'
          ignore-versions: 'latest'
          version-names: pr-${{ github.event.number }}

      - name: Delete PR image (arelx-gemstash)
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'arelx-gemstash'
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'false'
          ignore-versions: 'latest'
          version-names: pr-${{ github.event.number }}
