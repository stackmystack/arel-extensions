name: Build CI image

# Builds and publishes the CI runner image (.github/images/Dockerfile) to
# ghcr.io, tagged with a hash of that file's contents.
#
# This only ever runs on pushes to master (or manually), and it is the
# *only* place that pushes to the registry.
#
# PRs and fork PRs never push anywhere; see .github/workflows/ruby.yml.
#
# Trigger conditions, mapping directly to what actually needs a rebuild:
#   - .github/images/Dockerfile changed.
#   - this workflow file itself changed.
#   - workflow_dispatch manually requested.

on:
  push:
    branches:
      - master
    paths:
      - '.github/images/Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish CI image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: tag
        run: |
          hash=$(sha256sum .github/images/Dockerfile | cut -d' ' -f1)
          tag="ghcr.io/${{ github.repository_owner }}/arel-ci:${hash}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${tag}"

      - name: Check whether this image already exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image already published, nothing to do."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Image not found."
          fi

      - name: Log in to ghcr.io
        if: steps.exists.outputs.found == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.exists.outputs.found == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.exists.outputs.found == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .github/images
          file: .github/images/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
