services:
  arelx:
    container_name: arelx-matrix
    hostname: arelx-matrix
    build:
      context: ..
      dockerfile: dev/arelx.dockerfile
    volumes:
      - ../:/app
      - gem_cache:/mise/installs/ruby
    # Infinite loop to keep container alive for "Stateful Service" plan
    command: tail -f /dev/null
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mssql:
        condition: service_healthy
    environment:
      # Map ENV vars for database.yml / test suite
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
      MSSQL_HOST: mssql
      # MSSQL_SA_PASSWORD: Password12!
      MISE_TRUSTED_CONFIG_PATHS: /app

  mysql:
    image: mysql:8.0
    container_name: arelx-mysql
    environment:
      MYSQL_DATABASE: arelx_test
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    # command:
    #   [
    #     "--default-authentication-plugin=mysql_native_password",
    #     "--character-set-server=utf8mb4",
    #   ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    # build:
    #   context: ..
    #   dockerfile: dev/postgres.dockerfile
    image: postgres:16
    container_name: arelx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: arelx_test
    command: >
      bash -c "
      locale-gen fr_FR.utf8 && update-locale &&
      localedef -i fr_FR -c -f UTF-8 -A /usr/share/locale/locale.alias fr_FR.UTF-8 &&
      docker-entrypoint.sh postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: arelx-mssql
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Password12!
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 5s
      retries: 5
      start_period: 10s
      timeout: 5s

volumes:
  gem_cache:
